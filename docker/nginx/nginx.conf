events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # HTTP -> HTTPS (tous les domaines)
    server {
        listen 80;
        server_name ritoto-campus.com www.ritoto-campus.com api.ritoto-campus.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend React — ritoto-campus.com
    server {
        listen 443 ssl;
        server_name ritoto-campus.com www.ritoto-campus.com;

        ssl_certificate     /etc/letsencrypt/live/ritoto-campus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ritoto-campus.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        if ($host = www.ritoto-campus.com) {
            return 301 https://ritoto-campus.com$request_uri;
        }

        root  /var/www/html;
        index index.html;

        # Proxy vers Django (appels API depuis le frontend)
        location /api/ {
            proxy_pass         http://web:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /ws/ {
            proxy_pass         http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # API + WebSockets — api.ritoto-campus.com
    server {
        listen 443 ssl;
        server_name api.ritoto-campus.com;

        ssl_certificate     /etc/letsencrypt/live/api.ritoto-campus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ritoto-campus.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # WebSockets
        location /ws/ {
            proxy_pass         http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400;
        }

        # API REST + Admin
        location / {
            proxy_pass         http://web:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Fichiers statiques Django
        location /static/ {
            alias   /var/www/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Uploads
        location /media/ {
            alias   /var/www/media/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
