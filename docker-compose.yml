# ─── Docker Compose DÉVELOPPEMENT ────────────────────────────────────────────
# Usage : docker compose up
# - Hot reload Django (runserver)
# - SQLite local (db/ritoto-express.sqlite3)
# - Redis local (cache + WebSockets en mémoire)

services:

  redis:
    image: redis:7-alpine
    container_name: ritoto-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritoto-backend-dev
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app                         # hot reload : le code local est monté
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritoto-daphne-dev
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
