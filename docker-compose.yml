# ─── Docker Compose DÉVELOPPEMENT ────────────────────────────────────────────
# Usage : docker compose up
# - Hot reload Django (runserver)
# - PostgreSQL local
# - Redis local (cache + WebSockets en mémoire)

services:

  postgres:
    image: postgres:16-alpine
    container_name: ritoto-postgres-dev
    environment:
      POSTGRES_DB: ritoto
      POSTGRES_USER: ritoto
      POSTGRES_PASSWORD: ritoto_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritoto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ritoto-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritoto-backend-dev
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app                         # hot reload : le code local est monté
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      POSTGRES_DB: ritoto
      POSTGRES_USER: ritoto
      POSTGRES_PASSWORD: ritoto_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ritoto-daphne-dev
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: postgres
      POSTGRES_DB: ritoto
      POSTGRES_USER: ritoto
      POSTGRES_PASSWORD: ritoto_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_dev_data:
